html,body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{padding-bottom:84px}
header{background:linear-gradient(135deg,#d6477a,#b83b8f);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 16px 18px}
header h1{margin:0;font-size:22px;letter-spacing:.2px}
header p{margin:2px 0 0;font-size:13px;opacity:.85}
main{padding:14px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(120,40,80,.08)}
.card h2{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.monthbar{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.monthbar input{flex:1}
input{font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;width:100%}
input:focus{outline:2px solid var(--pink2);border-color:var(--pink)}
input[readonly]{background:#faf5f7;color:var(--mute)}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--pink);color:#fff;font-weight:600}
button:active{transform:scale(.97)}
button.ghost{background:#fff;color:var(--pink);border:1px solid var(--pink2)}
button.link{background:none;color:var(--pink);padding:6px 4px;font-size:14px}
button.x{background:none;color:var(--mute);padding:6px 10px;font-size:20px;line-height:1}
.cols,.row{display:grid;grid-template-columns:1fr 92px 92px 34px;gap:6px;align-items:center}
.cols{font-size:12px;color:var(--mute);margin-bottom:4px;text-align:center}
.cols span:first-child{text-align:left}
.item{border-top:1px solid var(--line);padding:8px 0}
.item:first-of-type{border-top:0}
.row{margin-bottom:6px}
.row.sub{padding-left:16px;grid-template-columns:1fr 92px 92px 34px}
.row.sub input.nm{font-size:14px}
.row input.n{text-align:right}
.ro{padding:10px;text-align:right;background:#faf5f7;border-radius:10px;color:var(--mute);border:1px solid var(--line);font-size:15px}
.total{display:grid;grid-template-columns:1fr 92px 92px 34px;gap:6px;border-top:2px solid var(--line);padding-top:10px;margin-top:6px;font-weight:700}
.total span:nth-child(2),.total span:nth-child(3){text-align:right;font-size:14px}
.salform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.salform .full{grid-column:1/-1}
.sal{display:grid;grid-template-columns:1fr 1fr 34px;gap:6px;margin-bottom:6px}
.mh{display:flex;justify-content:space-between;font-weight:700;margin:12px 0 6px;color:var(--pink)}
.big{font-size:30px;font-weight:800}
.pos{color:var(--green)} .neg{color:var(--red)}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-of-type{border-top:0}
.kv small{color:var(--mute)}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;background:#f3e8ee;margin:10px 0}
.stack div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--mute)}
.empty{color:var(--mute);font-size:14px;text-align:center;padding:10px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
nav button{flex:1;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:8px 0}
nav button span{font-size:20px}
nav button.on{color:var(--pink)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:12px;color:var(--mute);margin-top:8px}
.hide{display:none}
</style>
</head>
<body>
<header>
  <h1>🌸 Darla's System</h1>
  <p id="sub">Cashflow, assets &amp; liabilities</p>
</header>
<main id="app"></main>
<nav>
  <button data-tab="salary"><span>💰</span>Cashflow</button>
  <button data-tab="budget"><span>📒</span>Budget</button>
  <button data-tab="breakdown"><span>📊</span>Breakdown</button>
</nav>

<script>
const KEY = 'darlas-system-v1';
const PALETTE = ['#2f9e9e','#c2a100','#4a7bd6','#8a5a3c','#9e3fd6','#2f9e6e'];
const DEFAULT_SECS = [
  {k:'assets', t:'Assets', c:'var(--assets)', hint:'Money you keep or set aside'},
  {k:'liabilities', t:'Liabilities', c:'var(--liab)', hint:'Bills and what you owe'},
  {k:'play', t:'Play Money', c:'var(--play)', hint:'Fun and spending money'}
];
const DEFAULTS = {
  assets:['Insurance','Savings (Long Term)','Savings (Short Term)'],
  liabilities:['Electricity','Water','WiFi','Phone'],
  play:['Play Money']
};

const uid = () => Math.random().toString(36).slice(2, 9);
const num = v => { const n = parseFloat(String(v).replace(/,/g, '')); return isNaN(n) ? 0 : n; };
const peso = n => '₱' + (Math.round(n * 100) / 100).toLocaleString('en-PH', {minimumFractionDigits: 0, maximumFractionDigits: 2});
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };

let S = load();
let SECS = S.sections;
let tab = 'salary';
let cur = today();

function migrate(r) {
  const nm = {};
  Object.keys(r.months).forEach(k => {
    let nk = k;
    if (k.length === 7) {
      const first = r.salaries.filter(s => s.date.slice(0, 7) === k).map(s => s.date).sort()[0];
      nk = first || (k + '-01');
    }
    nm[nk] = r.months[k];
  });
  r.months = nm;
  return r;
}
function load() {
  try {
    const r = JSON.parse(localStorage.getItem(KEY));
    if (r && r.months && r.salaries) {
      if (!r.sections || !r.sections.length) r.sections = JSON.parse(JSON.stringify(DEFAULT_SECS));
      return migrate(r);
    }
  } catch (e) {}
  return {salaries: [], months: {}, sections: JSON.parse(JSON.stringify(DEFAULT_SECS))};
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

function blank() {
  const m = {};
  SECS.forEach(s => m[s.k] = (DEFAULTS[s.k] || []).map(n => ({id: uid(), name: n, exp: '', act: '', subs: []})));
  return m;
}
function M() {
  if (!S.months[cur]) {
    // copy structure from the closest earlier month, otherwise defaults
    const keys = Object.keys(S.months).filter(k => k < cur).sort();
    if (keys.length) {
      const src = S.months[keys[keys.length - 1]], m = {};
      SECS.forEach(s => m[s.k] = (src[s.k] || []).map(it => ({
        id: uid(), name: it.name, exp: it.exp, act: '',
        subs: (it.subs || []).map(sb => ({id: uid(), name: sb.name, exp: sb.exp, act: ''}))
      })));
      S.months[cur] = m;
    } else S.months[cur] = blank();
    save();
  }
  SECS.forEach(s => { if (!S.months[cur][s.k]) S.months[cur][s.k] = []; });
  return S.months[cur];
}

const val = (it, f) => it.subs && it.subs.length ? it.subs.reduce((a, s) => a + num(s[f]), 0) : num(it[f]);
const secTot = (sec, f) => M()[sec].reduce((a, it) => a + val(it, f), 0);
const salaryOf = d => S.salaries.filter(s => s.date === d).reduce((a, s) => a + num(s.amount), 0);
const salaryMonth = mk => S.salaries.filter(s => s.date.slice(0, 7) === mk).reduce((a, s) => a + num(s.amount), 0);
const monthUsed = k => { const m = S.months[k]; if (!m) return 0; return SECS.reduce((a, s) => a + (m[s.k] || []).reduce((b, it) => b + val(it, 'act'), 0), 0); };
const carryIn = mk => {
  const ks = new Set(Object.keys(S.months));
  S.salaries.forEach(s => ks.add(s.date));
  let c = 0;
  [...ks].filter(k => k < mk).sort().forEach(k => { c += salaryOf(k) - monthUsed(k); });
  return c;
};
const monthLabel = mk => { const [y, m] = mk.split('-'); return new Date(y, m - 1, 1).toLocaleString('en-US', {month: 'long', year: 'numeric'}); };
const dateLabel = d => { const [y, m, dd] = d.split('-'); return new Date(y, m - 1, dd).toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric'}); };

/* ---------- render ---------- */
function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const app = document.getElementById('app');
  app.innerHTML = tab === 'salary' ? viewSalary() : tab === 'budget' ? viewBudget() : viewBreakdown();
  if (tab === 'budget') refresh();
}

function monthBar() {
  return `<div class="monthbar">
    <button class="ghost" data-act="prev">‹</button>
    <input type="date" id="mpick" value="${cur}">
    <button class="ghost" data-act="next">›</button>
  </div>`;
}

function viewSalary() {
  const list = [...S.salaries].sort((a, b) => b.date.localeCompare(a.date));
  const groups = {};
  list.forEach(s => (groups[s.date.slice(0, 7)] = groups[s.date.slice(0, 7)] || []).push(s));
  const keys = Object.keys(groups).sort().reverse();
  const all = S.salaries.reduce((a, s) => a + num(s.amount), 0);
  return `
  <div class="card">
    <h2>Cashflow: Salary</h2>
    <div style="color:var(--mute);font-size:14px">Salary on ${dateLabel(cur)}</div>
    <div class="big" style="margin-bottom:12px">${peso(salaryOf(cur))}</div>
    <div class="salform">
      <input type="date" id="sdate" value="${today()}">
      <input type="text" inputmode="decimal" id="samt" placeholder="Amount e.g. 38000">
      <input class="full" type="text" id="snote" placeholder="Note (optional)">
      <button class="full" data-act="addsal">Save salary</button>
    </div>
  </div>
  <div class="card">
    <h2>Salary history <span style="margin-left:auto;font-size:14px;color:var(--mute)">Total ${peso(all)}</span></h2>
    ${keys.length ? keys.map(k => `
      <div class="mh"><span>${monthLabel(k)}</span><span>${peso(salaryMonth(k))}</span></div>
      ${groups[k].map(s => `
        <div class="sal" data-sid="${s.id}">
          <input type="date" data-sf="date" value="${esc(s.date)}">
          <input type="text" inputmode="decimal" data-sf="amount" value="${esc(s.amount)}" style="text-align:right">
          <button class="x" data-act="delsal">×</button>
        </div>
        ${s.note ? `<div class="note" style="margin:-2px 0 8px 4px">${esc(s.note)}</div>` : ''}
      `).join('')}
    `).join('') : '<div class="empty">No salary yet. Add the first one above.</div>'}
  </div>`;
}

function rowHtml(it, sec, sub, parent) {
  const hasSubs = !sub && it.subs && it.subs.length;
  const pid = sub ? parent.id : it.id;
  const attrs = `data-s="${sec}" data-i="${pid}"${sub ? ` data-sub="${it.id}"` : ''}`;
  const cell = f => hasSubs
    ? `<div class="ro" data-calc="item:${sec}:${it.id}:${f}"></div>`
    : `<input class="n" type="text" inputmode="decimal" data-f="${f}" ${attrs} value="${esc(it[f])}" placeholder="0">`;
  return `<div class="row${sub ? ' sub' : ''}">
    <input class="nm" type="text" data-f="name" ${attrs} value="${esc(it.name)}" placeholder="Sub item name">
    ${cell('exp')}${cell('act')}
    <button class="x" data-act="${sub ? 'delsub' : 'del'}" ${attrs}>×</button>
  </div>`;
}

function viewBudget() {
  const m = M();
  return monthBar() + SECS.map(s => `
  <div class="card">
    <h2><span class="dot" style="background:${s.c}"></span>${esc(s.t)}
      <span style="margin-left:auto"><button class="link" data-act="rensec" data-s="${s.k}">Rename</button><button class="link" data-act="delsec" data-s="${s.k}">Delete</button></span></h2>
    <div class="cols"><span>${esc(s.hint || 'Sub items')}</span><span>Expected</span><span>Actual</span><span></span></div>
    ${m[s.k].length ? m[s.k].map(it => `
      <div class="item">
        ${rowHtml(it, s.k, false)}
        ${(it.subs || []).map(sb => rowHtml(sb, s.k, true, it)).join('')}
      </div>`).join('') : '<div class="empty">No sub items yet. Tap + Add sub item.</div>'}
    <button class="ghost" style="width:100%;margin-top:6px" data-act="add" data-s="${s.k}">+ Add sub item</button>
    <div class="total"><span>Total</span><span data-calc="sec:${s.k}:exp"></span><span data-calc="sec:${s.k}:act"></span><span></span></div>
  </div>`).join('') + `
  <button class="ghost" style="width:100%;margin-bottom:14px" data-act="addsec">+ Add new section</button>
  <div class="card">
    <div class="kv"><span>Salary on this date</span><b data-calc="sal"></b></div>
    <div class="kv"><span>Carried over from earlier dates</span><b data-calc="carry"></b></div>
    <div class="kv"><span>Left after actuals<br><small>Goes into the next date</small></span><b data-calc="left"></b></div>
    <div class="note">See the Breakdown tab for the full picture.</div>
  </div>`;
}

function viewBreakdown() {
  const sal = salaryOf(cur);
  const tot = f => SECS.reduce((a, s) => a + secTot(s.k, f), 0);
  const tA = tot('act'), tE = tot('exp');
  const carry = carryIn(cur), avail = sal + carry;
  const leftA = avail - tA, leftE = avail - tE;
  const pct = n => avail > 0 ? Math.round(n / avail * 100) : 0;
  const stack = SECS.map(s => {
    const w = avail > 0 ? Math.min(100, secTot(s.k, 'act') / avail * 100) : 0;
    return `<div style="width:${w}%;background:${s.c}"></div>`;
  }).join('');
  return monthBar() + `
  <div class="card">
    <div style="color:var(--mute);font-size:14px">Available on ${dateLabel(cur)}</div>
    <div class="big">${peso(avail)}</div>
    <div class="note" style="margin-top:2px">Salary ${peso(sal)} + carried over ${peso(carry)}</div>
    <div class="stack">${stack}</div>
    <div class="legend">${SECS.map(s => `<span><span class="dot" style="background:${s.c}"></span> ${s.t} ${pct(secTot(s.k, 'act'))}%</span>`).join('')}</div>
  </div>
  <div class="card">
    <h2>Summary</h2>
    <div class="kv"><span>Salary</span><b>${peso(sal)}</b></div>
    <div class="kv"><span>Carried over<br><small>Left from earlier dates</small></span><b class="${carry < 0 ? 'neg' : ''}">${peso(carry)}</b></div>
    <div class="kv"><span>Total available</span><b>${peso(avail)}</b></div>
    ${SECS.map(s => `<div class="kv"><span>${s.t}<br><small>Expected ${peso(secTot(s.k, 'exp'))}</small></span><b>${peso(secTot(s.k, 'act'))}</b></div>`).join('')}
    <div class="kv"><span>Total used<br><small>Expected ${peso(tE)}</small></span><b>${peso(tA)}</b></div>
    <div class="kv"><span>Left over<br><small>Expected ${peso(leftE)} · carries to the next date</small></span><b class="${leftA < 0 ? 'neg' : 'pos'}">${peso(leftA)}</b></div>
  </div>
  ${SECS.map(s => {
    const items = M()[s.k];
    return `<div class="card"><h2><span class="dot" style="background:${s.c}"></span>${s.t}</h2>
    ${items.length ? items.map(it => {
      const a = val(it, 'act'), e = val(it, 'exp');
      const subs = (it.subs || []).map(sb => `<div class="kv" style="padding-left:16px;font-size:14px"><span>${esc(sb.name) || 'Sub item'}</span><span>${peso(num(sb.act))}</span></div>`).join('');
      return `<div class="kv"><span>${esc(it.name) || 'Item'}<br><small>Expected ${peso(e)}${avail > 0 ? ' · ' + pct(a) + '% of available' : ''}</small></span><b>${peso(a)}</b></div>${subs}`;
    }).join('') : '<div class="empty">Nothing here.</div>'}
    </div>`;
  }).join('')}
  <div class="card">
    <h2>Backup</h2>
    <div class="tools">
      <button class="ghost" data-act="export">Export backup</button>
      <button class="ghost" data-act="import">Import backup</button>
    </div>
    <input type="file" id="file" accept="application/json" class="hide">
    <div class="note">Everything is saved on this phone automatically. Export a backup now and then in case the browser data is cleared.</div>
  </div>`;
}

/* ---------- live totals (no re-render, keeps keyboard open) ---------- */
function refresh() {
  document.querySelectorAll('[data-calc]').forEach(el => {
    const p = el.dataset.calc.split(':');
    let v = 0;
    if (p[0] === 'item') { const it = M()[p[1]].find(x => x.id === p[2]); v = it ? val(it, p[3]) : 0; }
    else if (p[0] === 'sec') v = secTot(p[1], p[2]);
    else if (p[0] === 'sal') v = salaryOf(cur);
    else if (p[0] === 'carry') v = carryIn(cur);
    else if (p[0] === 'left') {
      v = salaryOf(cur) + carryIn(cur) - SECS.reduce((a, s) => a + secTot(s.k, 'act'), 0);
      el.className = v < 0 ? 'neg' : 'pos';
    }
    el.textContent = peso(v);
  });
}

/* ---------- events ---------- */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f) {
    const it = M()[t.dataset.s].find(x => x.id === t.dataset.i);
    if (!it) return;
    const tgt = t.dataset.sub ? it.subs.find(x => x.id === t.dataset.sub) : it;
    if (tgt) { tgt[t.dataset.f] = t.value; save(); refresh(); }
  } else if (t.dataset.sf) {
    const row = t.closest('[data-sid]');
    const s = S.salaries.find(x => x.id === row.dataset.sid);
    if (s) { s[t.dataset.sf] = t.value; save(); }
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'mpick' && t.value) { cur = t.value; render(); }
  else if (t.dataset.sf === 'date') { render(); }
  else if (t.id === 'file' && t.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (d && d.months && d.salaries && confirm('Replace everything on this phone with the backup?')) {
          S = migrate(d);
          if (!S.sections || !S.sections.length) S.sections = JSON.parse(JSON.stringify(DEFAULT_SECS));
          SECS = S.sections; save(); render();
        }
      } catch (err) { alert('That file is not a valid backup.'); }
    };
    r.readAsText(t.files[0]);
  }
});

function hasData(m) {
  return SECS.some(s => (m[s.k] || []).some(it => num(it.exp) || num(it.act) || (it.subs || []).some(sb => num(sb.exp) || num(sb.act))));
}
function knownDates() {
  const ks = new Set(Object.keys(S.months).filter(k => hasData(S.months[k])));
  S.salaries.forEach(s => ks.add(s.date));
  return [...ks].sort();
}
function shiftMonth(n) {
  const ks = knownDates();
  let t = n < 0 ? ks.filter(k => k < cur).pop() : ks.find(k => k > cur);
  if (!t) {
    const [y, m, d] = cur.split('-').map(Number);
    const dt = new Date(y, m - 1, d + n);
    t = dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
  }
  cur = t;
  render();
}

document.addEventListener('click', e => {
  const nb = e.target.closest('nav button');
  if (nb) { tab = nb.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act, m = M();
  const item = () => m[b.dataset.s].find(x => x.id === b.dataset.i);
  if (a === 'prev') shiftMonth(-1);
  else if (a === 'next') shiftMonth(1);
  else if (a === 'add') { m[b.dataset.s].push({id: uid(), name: '', exp: '', act: '', subs: []}); save(); render(); focusLast(b.dataset.s); }
  else if (a === 'addsec') {
    const name = (prompt('Name of the new section (for example: Investments)') || '').trim();
    if (name) { S.sections.push({k: 'c' + uid(), t: name, c: PALETTE[(S.sections.length - 3 + PALETTE.length * 4) % PALETTE.length], hint: ''}); SECS = S.sections; save(); render(); }
  }
  else if (a === 'rensec') {
    const s = SECS.find(x => x.k === b.dataset.s);
    const name = (prompt('Rename section', s.t) || '').trim();
    if (name) { s.t = name; save(); render(); }
  }
  else if (a === 'delsec') {
    const s = SECS.find(x => x.k === b.dataset.s);
    if (confirm('Delete "' + s.t + '" and all of its sub items in every month? This cannot be undone.')) {
      S.sections = S.sections.filter(x => x.k !== s.k);
      Object.values(S.months).forEach(mm => { delete mm[s.k]; });
      SECS = S.sections; save(); render();
    }
  }
  else if (a === 'addsub') {
    const it = item();
    if (it.subs.length === 0 && (num(it.exp) || num(it.act))) {
      it.subs.push({id: uid(), name: it.name || 'Main', exp: it.exp, act: it.act});
    }
    it.subs.push({id: uid(), name: '', exp: '', act: ''});
    save(); render();
  }
  else if (a === 'del') { if (confirm('Delete this sub item?')) { m[b.dataset.s] = m[b.dataset.s].filter(x => x.id !== b.dataset.i); save(); render(); } }
  else if (a === 'delsub') { const it = item(); it.subs = it.subs.filter(x => x.id !== b.dataset.sub); save(); render(); }
  else if (a === 'addsal') {
    const date = document.getElementById('sdate').value, amt = document.getElementById('samt').value;
    if (!date || !num(amt)) { alert('Please enter a date and an amount.'); return; }
    S.salaries.push({id: uid(), date, amount: amt, note: document.getElementById('snote').value.trim()});
    save(); cur = date; render();
  }
  else if (a === 'delsal') {
    if (confirm('Delete this salary entry?')) { S.salaries = S.salaries.filter(x => x.id !== b.closest('[data-sid]').dataset.sid); save(); render(); }
  }
  else if (a === 'export') {
    const blob = new Blob([JSON.stringify(S, null, 2)], {type: 'application/json'});
    const l = document.createElement('a');
    l.href = URL.createObjectURL(blob); l.download = 'darlas-system-backup-' + today() + '.json';
    document.body.appendChild(l); l.click(); l.remove();
  }
  else if (a === 'import') document.getElementById('file').click();
});

function focusLast(sec) {
  const rows = document.querySelectorAll(`input.nm[data-s="${sec}"]:not([data-sub])`);
  if (rows.length) rows[rows.length - 1].focus();
}

render();
</script>
</body>
</html>
